<style>
/* Layout: phone console — game screen on top, quest strip, chunky touch pad below; landscape moves the pad to the sides */
:root{
  color-scheme:dark;
  --night:#131833; --panel:#1c2347; --deep:#0b0f22; --stroke:#363f78;
  --sand:#f1d9a6; --sand-d:#b89a62; --cream:#fdf3de; --muted:#a3abd0;
  --coral:#ee6a4c; --coral-d:#a9412b; --sea:#2aa29e; --sea-d:#176d6a; --gold:#f5c451;
  --f-px:"Pixelify Sans", ui-monospace, "SF Mono", Menlo, monospace;
  --u:1.6px; --bs:78px;
}
html{height:100%;box-sizing:border-box;background:var(--night)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--cream);font-family:var(--f-px);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(circle at 50% 50%,rgba(241,217,166,.055) 1.5px,transparent 2.5px) 0 0/18px 18px,var(--night)}
#screen{position:relative;flex:none;width:240px;height:160px;background:#000;overflow:hidden;box-shadow:0 6px 0 var(--deep)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}

/* quest strip */
#quest{width:100%;display:flex;align-items:center;gap:10px;padding-block:12px 4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.qcard{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;background:var(--panel);border:2px solid var(--stroke);padding:8px 12px;box-shadow:0 3px 0 var(--deep)}
.ql{flex:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
#qt{font-size:14px;line-height:1.25;color:var(--cream);min-width:0}
#mute{flex:none;width:44px;height:44px;display:grid;place-items:center;background:var(--panel);border:2px solid var(--stroke);box-shadow:0 3px 0 var(--deep)}
#mute svg{width:22px;height:22px}
#mute .off{display:none}
#mute.muted .on{display:none}
#mute.muted .off{display:block}

/* pad */
#pad{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:8px max(26px,6vh);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dpad{display:flex;gap:12px}
.abtns{position:relative;width:calc(var(--bs)*2.15);height:calc(var(--bs)*1.75)}
.key{position:relative;display:grid;place-items:center;transition:transform .05s}
.arrow{width:var(--bs);height:calc(var(--bs)*1.12);background:var(--sand);border-radius:14px;box-shadow:0 6px 0 var(--sand-d),0 8px 0 var(--deep)}
.arrow svg{width:42%;height:42%}
.round{position:absolute;width:var(--bs);height:var(--bs);border-radius:50%;font-weight:700;font-size:12px;letter-spacing:.06em}
.round span{position:relative;z-index:1;text-shadow:0 2px 0 rgba(0,0,0,.28)}
.a{right:0;top:0;background:var(--coral);box-shadow:0 6px 0 var(--coral-d),0 8px 0 var(--deep)}
.b{left:0;bottom:0;background:var(--sea);box-shadow:0 6px 0 var(--sea-d),0 8px 0 var(--deep)}
.b i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(11,15,34,.55) calc(var(--cd,0)*360deg),transparent 0)}
.key.on{transform:translateY(5px)}
.arrow.on{box-shadow:0 1px 0 var(--sand-d),0 3px 0 var(--deep)}
.a.on{box-shadow:0 1px 0 var(--coral-d),0 3px 0 var(--deep)}
.b.on{box-shadow:0 1px 0 var(--sea-d),0 3px 0 var(--deep)}

/* landscape */
#app.land{flex-direction:row;justify-content:center;align-items:center}
#app.land #quest{position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:0;width:var(--side,160px);padding:0 10px 0 max(12px,env(safe-area-inset-left,0px));z-index:5}
#app.land .qcard{flex-direction:column;gap:3px;padding:7px 9px}
#app.land #qt{font-size:12px}
#app.land #mute{position:fixed;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px}
#app.land #pad{position:absolute;inset:0;padding:0;pointer-events:none}
#app.land .dpad,#app.land .abtns{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));pointer-events:auto}
#app.land .dpad{left:max(14px,env(safe-area-inset-left,0px));flex-direction:column-reverse;gap:10px}
#app.land .dpad{flex-direction:row}
#app.land .abtns{right:max(14px,env(safe-area-inset-right,0px))}

/* overlays inside the screen */
.ov{position:absolute;inset:0}
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*5);text-align:center;background:linear-gradient(180deg,rgba(11,15,34,.0) 30%,rgba(11,15,34,.55))}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.9}
.logo span{font-size:calc(var(--u)*11);letter-spacing:.18em;color:var(--cream);text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #0b0f22}
.logo b{font-size:calc(var(--u)*30);color:var(--coral);letter-spacing:.06em;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #0b0f22,calc(var(--u)*3) calc(var(--u)*3) 0 var(--gold)}
.sub{margin:0;font-size:max(11px,calc(var(--u)*5));color:var(--cream);text-shadow:1px 1px 0 #0b0f22;max-width:85%}
#play{background:var(--gold);color:#2a1a08;font-weight:700;font-size:max(14px,calc(var(--u)*7));padding:calc(var(--u)*3) calc(var(--u)*12);box-shadow:0 calc(var(--u)*2) 0 #a77a1c,0 calc(var(--u)*3.5) 0 #0b0f22;letter-spacing:.08em}
#play:active{transform:translateY(2px)}
.hint{margin:0;font-size:11px;color:var(--sand);opacity:.9}

#dlg{position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);top:calc(var(--u)*4);display:flex;gap:calc(var(--u)*4);align-items:flex-start;background:rgba(11,15,34,.94);border:calc(var(--u)*1) solid var(--sand);box-shadow:0 0 0 calc(var(--u)*1) #000;padding:calc(var(--u)*3.5);min-height:calc(var(--u)*30)}
#dface{flex:none;width:calc(var(--u)*22);height:calc(var(--u)*22);image-rendering:pixelated;background:#2b3266;border:1px solid var(--stroke)}
#dlg .tx{flex:1;min-width:0}
#dname{display:block;font-size:max(11px,calc(var(--u)*5));color:var(--gold);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
#dtext{margin:0;font-size:max(13px,calc(var(--u)*6.4));line-height:1.3;color:var(--cream)}
#dmore{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*2);font-size:max(10px,calc(var(--u)*4.5));color:var(--sand);animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(2px)}}

#toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-6px);background:rgba(11,15,34,.9);border:1px solid var(--gold);color:var(--gold);padding:calc(var(--u)*1.5) calc(var(--u)*5);font-size:max(12px,calc(var(--u)*6));font-weight:700;white-space:nowrap;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* full overlays */
.full{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#card{background:#0b0e1d;opacity:0;pointer-events:none;transition:opacity .35s;text-align:center;z-index:60}
#card.on{opacity:1;pointer-events:auto}
#card h2{margin:0;font-size:34px;color:var(--cream);letter-spacing:.04em;text-wrap:balance}
#card p{margin:8px 0 0;font-size:15px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}

#phone{background:rgba(8,10,22,.8)}
.ph{width:min(300px,100%);background:#20263f;border:3px solid #0b0f22;box-shadow:0 0 0 3px var(--stroke),0 10px 0 #0b0f22;border-radius:26px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.ph-top{text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:700}
#phNum{height:44px;display:grid;place-items:center;background:#0e1326;border:2px solid var(--stroke);font-size:28px;letter-spacing:.2em;color:var(--cream);font-variant-numeric:tabular-nums}
#phMsg{min-height:34px;text-align:center;font-size:13px;line-height:1.3;color:var(--sand)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:48px;background:#2f3760;border:2px solid #0b0f22;border-radius:12px;font-size:22px;font-weight:600;box-shadow:0 3px 0 #0b0f22}
.keys button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0f22}
#phCall{height:50px;background:#3bbf6a;color:#08240f;border-radius:25px;font-size:18px;font-weight:700;box-shadow:0 4px 0 #1f7a40,0 6px 0 #0b0f22}
#phCall:active{transform:translateY(3px)}
.ph.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

#end{background:rgba(8,10,22,.86)}
.endbox{width:min(340px,100%);background:var(--panel);border:3px solid var(--sand);box-shadow:0 0 0 3px #0b0f22,0 10px 0 #0b0f22;padding:22px 20px;display:flex;flex-direction:column;gap:14px;text-align:center}
.endbox h2{margin:0;font-size:26px;color:var(--gold);text-wrap:balance}
.stats{display:grid;grid-template-columns:1fr auto;gap:8px 16px;text-align:left;font-size:16px}
.stats b{text-align:right;color:var(--cream);font-variant-numeric:tabular-nums}
.stats span{color:var(--muted)}
#again{background:var(--coral);color:#2a0d06;font-weight:700;font-size:18px;padding:12px;box-shadow:0 5px 0 var(--coral-d),0 7px 0 #0b0f22;letter-spacing:.06em}
#again:active{transform:translateY(3px)}
.soon{margin:0;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#dmore{animation:none}#card{transition:none}}
</style>

<div id="app">
  <div id="screen">
    <canvas id="cv" width="240" height="160"></canvas>
    <div id="title" class="ov">
      <div class="logo"><span>БАРСЕЛОНА</span><b>БРО</b></div>
      <p class="sub">Глава 1. Кира, Федя и пёс Какус</p>
      <button id="play" type="button">ИГРАТЬ</button>

    <div id="toast"></div>
  </div>
  <div id="quest"><div class="qcard"><span class="ql">Задание</span><span id="qt">Нажми «Играть»</span></div>
    <button id="mute" type="button" aria-label="Звук вкл/выкл"><svg class="on" viewBox="0 0 24 24" fill="none" stroke="#f1d9a6" stroke-width="2.2" stroke-linecap="square"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#f1d9a6"/><path d="M16 9c1.5 1.5 1.5 4.5 0 6M19 6c3 3 3 9 0 12"/></svg><svg class="off" viewBox="0 0 24 24" fill="none" stroke="#f1d9a6" stroke-width="2.2" stroke-linecap="square"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#f1d9a6"/><path d="M16 9l6 6M22 9l-6 6"/></svg></button>
  </div>
  <div id="pad">
    <div class="dpad">
      <button class="key arrow" data-k="left" type="button" aria-label="Влево"><svg viewBox="0 0 10 10"><path d="M7 1 2 5l5 4z" fill="#131833"/></svg></button>
      <button class="key arrow" data-k="right" type="button" aria-label="Вправо"><svg viewBox="0 0 10 10"><path d="M3 1l5 4-5 4z" fill="#131833"/></svg></button>
    </div>
    <div class="abtns">
      <button class="key round b" data-k="b" type="button"><i id="bcd"></i><span id="bl">АПОРТ</span></button>
      <button class="key round a" data-k="a" type="button"><span id="al">ПРЫЖОК</span></button>
    </div>
  </div>
</div>

<div id="card" class="full"><div><h2 id="cardT"></h2><p id="cardS"></p></div></div>
<div id="phone" class="full" hidden>
  <div class="ph" id="ph">
    <div class="ph-top">Экстренный вызов</div>
    <div id="phNum">&nbsp;</div>
    <div id="phMsg">Набери номер экстренных служб Испании</div>
    <div class="keys">
      <button type="button" data-d="1">1</button><button type="button" data-d="2">2</button><button type="button" data-d="3">3</button>

    </div>
    <button id="phCall" type="button">Позвонить</button>
  </div>
</div>
<div id="end" class="full" hidden>

    </div>
    <button id="again" type="button">ИГРАТЬ СНОВА</button>
    <p class="soon">Глава 2 — скоро</p>
  </div>
</div>

function* wait(n){for(let i=0;i<n;i++)yield;}

function* until(fn){while(!fn())yield;}
function* walkTo(a,x,sp=1.2){while(Math.abs(a.x-x)>sp){a.facing=x>a.x?1:-1;a.x+=a.facing*sp;a.walking=true;a.moving=true;a.anim+=sp>2?2:1;yield;}a.x=x;a.walking=false;a.moving=false;}
function trailAt(tr,dist){let acc=0;for(let i=tr.length-1;i>0;i--){const a=tr[i],b=tr[i-1];acc+=Math.abs(a.x-b.x)+Math.abs(a.y-b.y)*0.5;if(acc>=dist)return b;}return tr[0];}
function follow(a,t,sp){if(!t)return;const dx=t.x-a.x,st=clamp(dx,-sp,sp);a.x+=st;a.y+=clamp(t.y-a.y,-6,6);const mv=Math.abs(st)>0.15;if(mv){a.facing=st>0?1:-1;a.anim+=Math.abs(st)>2?2:1;}a.walking=mv;a.moving=mv;a.air=t.air&&Math.abs(t.y-a.y)<8;}

class Actor{
  constructor(set,x,y){this.set=set;this.x=x;this.y=y;this.vy=0;this.facing=1;this.walking=false;this.anim=0;this.air=false;this.onGround=true;this.visible=true;this.inv=0;this.sit=false;this.fallen=false;this.coyote=0;this.lunge=0;}
  frame(){if(this.sit||this.air)return'jump';if(this.walking)return(Math.floor(this.anim/7)%2)?'pass':'stride';return'idle';}
  draw(c,cx){
    if(!this.visible)return;if(this.inv>0&&(this.inv>>2)%2)return;
    const img=this.set[this.frame()][this.facing>0?0:1];
    const x=Math.round(this.x-cx+(this.lunge>0?this.facing*3:0)),y=Math.round(this.y);
    if(this.fallen){c.save();c.translate(x,y);c.rotate(Math.PI/2);c.drawImage(this.set.idle[0],-img.width,-img.height/2);c.restore();return;}
    c.drawImage(img,x-8,y-img.height);
  }
}

}

  yield* say('nat','Кира! Я всё видела. Ты мой герой!');
  yield* say('','Подойди к Нэт и жми ЦМОК.');setQuest('Поцелуй Нэт');s.walkFree=true;yield* until(()=>s.kissedC);yield* wait(45);
  yield* say('nat','Езжайте на пляж, а я вас потом найду.');
  cardTransition('Барселонета','Уровень 4',()=>setScene(new WalkScene(levelB())));yield* wait(99999);}

// ================= title & finish =================
class TitleScene{constructor(){this.t=0;this.kind='title';}update(){this.t++;setB('АПОРТ');if(consume('a')||consume('b')){startGame();}}
  draw(c){const d=this.t*1.4;drawBG(c,'drive',d,this.t);drawGreen(c,96,ROAD+Math.round(Math.sin(this.t*0.2)*0.6),d*0.2,{heads:true,dog:true});}}
function startGame(){if(G.lock)return;G.coins=0;G.vinyls=new Set();G.hearts=new Set();G.friend=false;G.pops=[];$('#title').hidden=true;
  cardTransition('Готический квартал','Уровень 1',()=>{setScene(new WalkScene(levelA()));setQuest('…');});}
function finish(){let best=0;try{best=+localStorage.getItem('bcnbro_best')||0;}catch(e){}if(G.coins>best){best=G.coins;try{localStorage.setItem('bcnbro_best',best);}catch(e){}}
  $('#stC').textContent=G.coins;$('#stV').textContent=G.vinyls.size+'/'+TOTAL_V;$('#stH').textContent=G.hearts.size+'/'+TOTAL_H;$('#stB').textContent=best;sfx.win();setQuest('Глава 1 пройдена');setTimeout(()=>{$('#end').hidden=false;},500);}

// ================= layout & loop =================
let low,lctx,dcv,dctx;
let probe=null;
function insets(){if(!probe){probe=document.createElement('div');probe.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)';document.body.appendChild(probe);}const cs=getComputedStyle(probe);return{l:parseFloat(cs.paddingLeft)||0,r:parseFloat(cs.paddingRight)||0};}
function layout(){const app=$('#app'),vw=app.clientWidth,vh=app.clientHeight;const land=vw>vh*1.15;app.classList.toggle('land',land);
  const root=document.documentElement.style;let cw,ch,bs;
  if(land){ch=vh;cw=ch*1.5;if(cw>vw*0.6){cw=vw*0.6;ch=cw/1.5;}cw=Math.floor(cw);const side=(vw-cw)/2,ins=insets(),eff=side-Math.max(14,ins.l,ins.r)-8;
    bs=Math.min(74,vh*0.22,(eff-12)/2,eff/2.15);root.setProperty('--side',Math.floor(side)+'px');}
  else{cw=Math.min(vw,620);ch=cw/1.5;const maxH=vh*0.55;if(ch>maxH){ch=maxH;cw=ch*1.5;}cw=Math.floor(cw);bs=Math.min(92,vw*0.19,(vh-ch-90)/2.2);}
  ch=Math.floor(cw/1.5);const s=$('#screen');s.style.width=cw+'px';s.style.height=ch+'px';
  root.setProperty('--u',(cw/240).toFixed(3)+'px');root.setProperty('--bs',Math.max(46,Math.floor(bs))+'px');
  const dpr=window.devicePixelRatio||1,k=Math.max(1,Math.min(6,Math.round(cw/W*dpr)));if(dcv.width!==W*k){dcv.width=W*k;dcv.height=H*k;}}
function step(){G.t++;if(Dlg.open){Dlg.update();if(consume('a')||consume('b')||consume('tap'))Dlg.advance();}if(!G.lock&&G.scene)G.scene.update();
  for(const p of G.pops){p.y-=0.5;p.life--;}G.pops=G.pops.filter(p=>p.life>0);}
function render(){const c=lctx;c.save();if(G.shake>0){c.translate(ri(-2,2),ri(-1,1));G.shake--;}if(G.scene)G.scene.draw(c);c.restore();
  for(const p of G.pops)ptext(lctx,p.txt,Math.round(p.x-p.txt.length*2),Math.round(p.y),p.col);
  dctx.imageSmoothingEnabled=false;dctx.drawImage(low,0,0,dcv.width,dcv.height);}
let last=0,acc=0;
function frame(now){requestAnimationFrame(frame);if(!last)last=now;let dt=(now-last)/1000;last=now;if(dt>0.25)dt=0.25;acc+=dt;let n=0;while(acc>=1/60&&n<5){step();acc-=1/60;n++;}if(n)render();edge.a=edge.b=edge.tap=false;}
function boot(){low=cvs(W,H);lctx=low.getContext('2d');lctx.imageSmoothingEnabled=false;dcv=$('#cv');dctx=dcv.getContext('2d');
  buildSprites();buildBG();bindInput();bindUI();layout();addEventListener('resize',layout);
  if(window.visualViewport)visualViewport.addEventListener('resize',layout);
  setScene(new TitleScene());setQuest('Нажми «Играть»');requestAnimationFrame(frame);}
window.BCN={G,setScene,WalkScene,DriveScene,ChaseScene,levelA,levelB,levelT,DRIVE1,DRIVE2,ArrivalsGame,STAR,FilmGame,PokeGame,Phone,keys,press,release,edge,Dlg,startGame,SPR,cardTransition};
boot();
})();
